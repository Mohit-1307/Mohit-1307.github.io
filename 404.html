<style>

  a{display:inline-block;padding:14px 30px;border-radius:14px;background:var(--grad);color:#fff;text-decoration:none;font-weight:700;transition:transform .3s,box-shadow .3s}
  a:hover{transform:translateY(-3px);box-shadow:0 18px 40px -14px rgba(99,102,241,.5)}
